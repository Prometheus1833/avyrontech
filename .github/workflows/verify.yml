name: Verify AVYRON

on:
  pull_request:
    branches: [main, codex/security-boundaries-2026-11-08]
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check application and Worker types
        run: npm run typecheck

      - name: Lint source
        run: npm run lint

      - name: Audit all D1 migrations
        run: npm run audit:d1

      - name: Validate security audit inventory and standard references
        run: npm run audit:security

      - name: Check editable service content and effective product catalog
        run: npm run service-content:check && npm run catalog:produse:check

      - name: Build Cloudflare Pages output
        # CI verifies the committed snapshot. Production builds still fetch
        # published content; GitHub runners must not depend on public WAF access.
        env:
          SERVICE_CONTENT_SNAPSHOT_SKIP: "1"
        run: npm run build:pages

      - name: Run tests against prerendered output
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real HttpOnly cookie transport in isolated localhost
        run: npm run test:security:browser-cookie

      - name: Run browser journeys
        run: npm run test:e2e

      - name: Validate standalone site Worker build
        env:
          SERVICE_CONTENT_SNAPSHOT_SKIP: "1"
        run: npm run build:worker

      - name: Validate API and email Workers
        run: npm run build:api && npm run build:email
